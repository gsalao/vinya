name: Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Fired by the spreadsheet's Apps Script, thirty seconds after the owner's last
  # edit. See docs/superpowers/specs/2026-08-19-sheets-cms-design.md
  repository_dispatch:
    types: [content-update]

# Code pushes still supersede each other: a slow older build must never land on
# top of a newer one. Content runs get their own group and do NOT cancel, because
# a run cancelled between its commit and its deploy would leave main ahead of the
# live site with nothing scheduled to fix it.
concurrency:
  group: >-
    ${{ github.event_name == 'repository_dispatch'
        && 'content-sync'
        || format('deploy-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name != 'repository_dispatch' }}

# The Vercel CLI reads all three of these straight from the environment, so no
# command below passes --token. An inline --token=${{ secrets.X }} expands to a
# bare `--token=` when the secret is missing, which the CLI reports as "no
# existing credentials" rather than "your secret is not set".
#
# push to main and content updates => production, pull request => throwaway preview.
# That boolean is repeated, deliberately, at each of the four places that need it
# below and elsewhere in this file (VERCEL_ENV and PROD_FLAG right here,
# jobs.deploy.environment.name, and the echo in "Check required secrets are
# present"), instead of being factored into one shared variable. A shared
# `env.IS_PROD` cannot actually do the job: `jobs.<job_id>.environment` has no
# access to the job's `env:` context (see the comment on that field below), and
# entries within a single `env:` block cannot reference their own siblings
# either, so VERCEL_ENV and PROD_FLAG could not have consumed it even though
# they sit right next to it. Anyone adding a fifth trigger type must edit all
# four sites by hand.
env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
  VERCEL_ENV: ${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'production' || 'preview' }}
  PROD_FLAG: ${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && '--prod' || '' }}

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    # Surfaces the live URL on the repo's home page sidebar and under
    # Deployments, and keeps the production link pointing at whatever main last
    # shipped.
    #
    # This field cannot read the job's `env:` context (environment selection has
    # to be resolved before environment-scoped secrets/vars come into play), so
    # the push-or-dispatch condition is written out again here rather than
    # referencing a shared variable. See the comment on the `env:` block above
    # for why that's true of the other repeats of this condition too.
    environment:
      name: ${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'production' || 'preview' }}
      url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4

      # No version pin: action-setup reads packageManager from package.json,
      # so the runner uses the same pnpm the lockfile was written with.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # After checkout and install, not before: a missing secret still costs
      # ~40s of setup on a genuinely misconfigured run, but a content-run
      # failure here now leaves both failure reporters below able to run.
      # report-status.mjs and notify-failure.mjs import scripts/lib modules
      # that need the checkout, and google-auth-library / nodemailer, which
      # need the install — fail before either exists and both reporters die
      # on "module not found" instead of writing anything, leaving Status!B2
      # stuck on the Apps Script's "Publishing…" forever with no mail sent.
      # This is the same reasoning, applied earlier in the job, as the
      # "Report an unexpected failure to the editor" step further down.
      - name: Check required secrets are present
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          missing=()
          [ -n "$VERCEL_TOKEN" ]      || missing+=(VERCEL_TOKEN)
          [ -n "$VERCEL_ORG_ID" ]     || missing+=(VERCEL_ORG_ID)
          [ -n "$VERCEL_PROJECT_ID" ] || missing+=(VERCEL_PROJECT_ID)
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            [ -n "$PUBLIC_SUPABASE_URL" ]       || missing+=(PUBLIC_SUPABASE_URL)
            [ -n "$SUPABASE_SERVICE_ROLE_KEY" ] || missing+=(SUPABASE_SERVICE_ROLE_KEY)
          fi
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Not set for this job: ${missing[*]}"
            echo "Add them under Settings -> Secrets and variables -> Actions -> Repository secrets."
            echo "That exact tab: secrets on the Codespaces or Dependabot tabs are invisible here."
            echo "This job targets the '${{ (github.event_name == 'push' || github.event_name == 'repository_dispatch') && 'production' || 'preview' }}' environment."
            echo "If you added them as *environment* secrets, they must be on that environment."
            exit 1
          fi
          echo "All required secrets are present."

      - name: Sync content from the editor
        id: sync
        if: github.event_name == 'repository_dispatch'
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # 2>&1 because every failure bullet is written to stderr, and the
          # reporting steps below read this file. pipefail because GitHub's
          # default shell is `bash -e {0}`: without it the pipeline reports
          # tee's exit code and a rejected sync would look like a success.
          set -o pipefail
          node scripts/sync-content.mjs 2>&1 | tee sync.log

      - name: Report a failed sync to the editor
        if: github.event_name == 'repository_dispatch' && failure()
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # The first bullet from the sync's own report. It already names the tab,
          # the row and what to type instead, so it needs no reformatting.
          problem=$(grep -m1 '^  • ' sync.log | sed 's/^  • //')
          node scripts/report-status.mjs "Not published — ${problem:-the content could not be read. Ask the developer.}"

      - name: Email the owner about the failure
        if: github.event_name == 'repository_dispatch' && failure()
        continue-on-error: true
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/notify-failure.mjs

      - name: Commit the updated content
        id: commit
        if: github.event_name == 'repository_dispatch' && success()
        run: |
          if ! grep -q 'SYNC_RESULT=changed' sync.log; then
            echo "Nothing changed. Skipping the commit and the deploy."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name  "vinya-content[bot]"
          git config user.email "vinya-content[bot]@users.noreply.github.com"
          git add src/lib/content.generated.json

          # [skip ci] belt and braces: a push made with the default GITHUB_TOKEN
          # already does not trigger further workflow runs, which is the guard that
          # stops this deploying itself in a loop. The marker documents the intent
          # for anyone reading the history.
          git commit -m "content: update from the editor [skip ci]"

          # Rebase rather than merge: content runs are serialised by the concurrency
          # group, but a code push can still land between checkout and here.
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Install Vercel CLI
        if: github.event_name != 'repository_dispatch' || steps.commit.outputs.changed == 'true'
        run: npm install -g vercel@51

      # Fetches project settings plus the environment variables configured in
      # Vercel (PUBLIC_SUPABASE_*), which the build step then reads.
      - name: Pull Vercel project settings
        if: github.event_name != 'repository_dispatch' || steps.commit.outputs.changed == 'true'
        run: vercel pull --yes --environment="$VERCEL_ENV"

      # Also the CI build check: a broken build fails here, before anything is
      # uploaded, so a red PR can never be merged into a deployable main.
      - name: Build
        if: github.event_name != 'repository_dispatch' || steps.commit.outputs.changed == 'true'
        run: vercel build $PROD_FLAG

      - name: Deploy
        id: deploy
        if: github.event_name != 'repository_dispatch' || steps.commit.outputs.changed == 'true'
        run: |
          deployment_url=$(vercel deploy --prebuilt $PROD_FLAG)

          # Every deployment gets an immutable per-deployment URL, and --prod then
          # repoints the project's production domains at it. That per-deployment URL
          # changes on every push, so reporting it would leave the repo's Deployments
          # link pointing at one frozen build. Resolve the stable alias instead:
          # a custom domain if one is attached, else the shortest *.vercel.app.
          # Previews have no aliases, so they keep their own URL.
          url="$deployment_url"
          if [ -n "$PROD_FLAG" ]; then
            alias=$(vercel inspect "$deployment_url" --json \
              | jq -r '[.aliases // [] | .[]] | (map(select(endswith(".vercel.app") | not)) + sort_by(length))[0] // empty')
            if [ -n "$alias" ]; then
              url="https://$alias"
            fi
          fi

          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "deployment-url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Deployed to \`$VERCEL_ENV\`"
            echo ""
            echo "- Live: $url"
            echo "- This build: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Report success to the editor
        if: github.event_name == 'repository_dispatch' && success() && steps.commit.outputs.changed == 'true'
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/report-status.mjs "Your changes are live." live "${{ steps.deploy.outputs.url }}"

      - name: Report a no-op to the editor
        if: github.event_name == 'repository_dispatch' && success() && steps.commit.outputs.changed != 'true'
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/report-status.mjs "Nothing to publish — the site already matches your latest changes." idle

      # Catch-all for everything the two reporters above cannot see. Both of them
      # sit right after "Sync content from the editor" and their `failure()`
      # checks are evaluated at that point in the sequence, so they only ever
      # fire for a sync failure (or something that failed even earlier, before
      # sync ran). If the sync succeeds and something later fails instead — a
      # `git push` conflict in "Commit the updated content", a Vercel outage, a
      # build break the content validator cannot catch — the job ends failed but
      # neither of those steps runs again, and the two success reporters above
      # both require success(), which is now false. Nothing would report it and
      # Status!B2 would stay on "Publishing…" forever: the exact failure mode
      # this whole reporting chain exists to prevent, just triggered by
      # infrastructure instead of content.
      #
      # `steps.sync.outcome == 'success'` is what makes this mutually exclusive
      # with "Report a failed sync to the editor" rather than a duplicate of it:
      # that step's `if: ... && failure()` already fires whenever the job is
      # already failed by the time it runs — i.e. the sync itself failed, or
      # something even earlier (checkout, install) did, leaving `sync` skipped.
      # Neither of those leaves `steps.sync.outcome` as 'success'. Only "sync
      # completed cleanly, something after it did not" does, which is exactly
      # the gap this step covers.
      - name: Report an unexpected failure to the editor
        if: github.event_name == 'repository_dispatch' && failure() && steps.sync.outcome == 'success'
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/report-status.mjs "Not published — your change was accepted, but a technical problem stopped the website from updating. This is not something you can fix — contact your developer."

      - name: Email the owner about an unexpected failure
        if: github.event_name == 'repository_dispatch' && failure() && steps.sync.outcome == 'success'
        continue-on-error: true
        env:
          MAIL_HOST: ${{ secrets.MAIL_HOST }}
          MAIL_PORT: ${{ secrets.MAIL_PORT }}
          MAIL_USER: ${{ secrets.MAIL_USER }}
          MAIL_PASS: ${{ secrets.MAIL_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: node scripts/notify-failure.mjs --generic

      - name: Comment the preview URL on the PR
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BODY: |
            Preview deploy for ${{ github.event.pull_request.head.sha }}:
            ${{ steps.deploy.outputs.url }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --edit-last --body "$BODY" \
            || gh pr comment "${{ github.event.pull_request.number }}" --body "$BODY"
